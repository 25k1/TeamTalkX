name: Set up the toolchain
description: Flutter and packages, and optionally Java with the Android SDK parts or the host build of the native module, with their downloads and compiler output cached.

inputs:
  android:
    description: Install Java and accept the SDK licenses; the Android Gradle plugin installs the platform, NDK and CMake that build.gradle.kts names.
    default: "false"
  native:
    description: Build the native module for the host, "plain" or "sanitize", or "none".
    default: "none"

runs:
  using: composite
  steps:
    - if: inputs.android == 'true'
      uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
      with:
        distribution: temurin
        java-version: "21"
        cache: gradle

    - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
      with:
        flutter-version-file: pubspec.yaml
        channel: stable
        cache: true

    - name: Get packages
      shell: bash
      run: flutter pub get

    - name: Read the native toolchain versions
      if: inputs.android == 'true' || inputs.native != 'none'
      id: versions
      shell: bash
      run: |
        gradle=android/app/build.gradle.kts
        ndk="$(sed -n 's/^ *ndkVersion = "\(.*\)"$/\1/p' "$gradle")"
        cmake="$(sed -n '/cmake {/,/}/s/^ *version = "\(.*\)"$/\1/p' "$gradle")"
        if [[ -z "$ndk" || -z "$cmake" ]]; then
          echo "::error::Could not read ndkVersion and the CMake version from $gradle"
          exit 1
        fi
        echo "ndk=$ndk" >> "$GITHUB_OUTPUT"
        echo "cmake=$cmake" >> "$GITHUB_OUTPUT"
        {
          echo "CCACHE_DIR=$HOME/.ccache"
          echo "CCACHE_MAXSIZE=400M"
          echo "CCACHE_COMPILERCHECK=content"
          echo "CMAKE_C_COMPILER_LAUNCHER=ccache"
          echo "CMAKE_CXX_COMPILER_LAUNCHER=ccache"
        } >> "$GITHUB_ENV"

    - name: Cache the native sources
      if: steps.versions.outcome == 'success'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: build/native-downloads
        key: native-downloads-${{ hashFiles('native/CMakeLists.txt') }}

    - name: Cache the NDK and CMake
      if: inputs.android == 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: |
          /usr/local/lib/android/sdk/ndk/${{ steps.versions.outputs.ndk }}
          /usr/local/lib/android/sdk/cmake/${{ steps.versions.outputs.cmake }}
        key: android-ndk-${{ steps.versions.outputs.ndk }}-cmake-${{ steps.versions.outputs.cmake }}

    - name: Cache compiler output
      if: steps.versions.outcome == 'success'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: ~/.ccache
        key: ccache-${{ github.job }}-${{ inputs.android }}-${{ inputs.native }}-${{ github.sha }}
        restore-keys: ccache-${{ github.job }}-${{ inputs.android }}-${{ inputs.native }}-

    - name: Install ccache
      if: steps.versions.outcome == 'success'
      shell: bash
      run: |
        command -v ccache > /dev/null || {
          sudo apt-get update -qq
          sudo apt-get install -y -qq ccache > /dev/null
        }
        ccache --zero-stats > /dev/null

    - name: Accept the Android SDK licenses
      if: inputs.android == 'true'
      shell: bash
      run: |
        { yes 2> /dev/null || true; } | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null

    - name: Build the native module for the host
      if: inputs.native == 'plain'
      shell: bash
      run: bash scripts/build_native_host.sh

    - name: Build the native module with AddressSanitizer and UBSan
      if: inputs.native == 'sanitize'
      shell: bash
      run: bash scripts/build_native_host.sh --sanitize
