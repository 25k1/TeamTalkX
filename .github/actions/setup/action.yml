name: Set up the toolchain
description: Flutter and packages, and optionally Java with the Android SDK licenses or the host build of the native module, with the native sources and compiler output cached.

inputs:
  android:
    description: Install Java and accept the SDK licenses; the Android Gradle plugin installs the platform, NDK and CMake that build.gradle.kts names.
    default: "false"
  native:
    description: Build the native module for the host, "plain" or "sanitize", or "none".
    default: "none"

runs:
  using: composite
  steps:
    - if: inputs.android == 'true'
      uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78
      with:
        distribution: temurin
        java-version: "21"
        cache: gradle

    - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
      with:
        flutter-version-file: pubspec.yaml
        channel: stable
        cache: true

    - name: Get packages
      shell: bash
      run: flutter pub get

    - name: Compile native code through ccache
      if: inputs.android == 'true' || inputs.native != 'none'
      id: ccache
      shell: bash
      run: |
        {
          echo "CCACHE_DIR=$HOME/.ccache"
          echo "CCACHE_MAXSIZE=400M"
          echo "CCACHE_COMPILERCHECK=content"
          echo "CMAKE_C_COMPILER_LAUNCHER=ccache"
          echo "CMAKE_CXX_COMPILER_LAUNCHER=ccache"
        } >> "$GITHUB_ENV"

    - name: Cache the native sources
      if: steps.ccache.outcome == 'success'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: build/native-downloads
        key: native-downloads-${{ hashFiles('native/CMakeLists.txt') }}

    - name: Cache compiler output
      if: steps.ccache.outcome == 'success'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: ~/.ccache
        key: ccache-${{ github.job }}-${{ inputs.android }}-${{ inputs.native }}-${{ github.sha }}
        restore-keys: ccache-${{ github.job }}-${{ inputs.android }}-${{ inputs.native }}-

    - name: Install ccache
      if: steps.ccache.outcome == 'success'
      shell: bash
      run: |
        command -v ccache > /dev/null || {
          sudo apt-get update -qq
          sudo apt-get install -y -qq ccache > /dev/null
        }
        ccache --zero-stats > /dev/null

    - name: Accept the Android SDK licenses
      if: inputs.android == 'true'
      shell: bash
      run: |
        { yes 2> /dev/null || true; } | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null

    - name: Build the native module for the host
      if: inputs.native == 'plain'
      shell: bash
      run: bash scripts/build_native_host.sh

    - name: Build the native module with AddressSanitizer and UBSan
      if: inputs.native == 'sanitize'
      shell: bash
      run: bash scripts/build_native_host.sh --sanitize
