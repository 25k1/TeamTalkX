version: 2
updates:
  - package-ecosystem: github-actions
    directories: ["/", "/.github/actions/*"]
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
      include: scope

  - package-ecosystem: pub
    directory: /
    schedule:
      interval: weekly
    groups:
      pub:
        patterns: ["*"]
    commit-message:
      prefix: build
      include: scope
