name: APK

on:
  workflow_call:
    inputs:
      release-tag:
        description: The release to sign for and upload to; empty for a debug arm64 build.
        type: string
        default: ""
    secrets:
      TT_RELEASE_KEYSTORE_BASE64:
        required: false
      TT_RELEASE_STORE_PASSWORD:
        required: false
      TT_RELEASE_KEY_ALIAS:
        required: false
      TT_RELEASE_KEY_PASSWORD:
        required: false

env:
  RELEASE_CERT_SHA256: 42589837960ba88115fb4f3a72ed4582eb3c4db4781e9f3a4ba789972e659558

jobs:
  apk:
    name: ${{ inputs.release-tag == '' && 'Debug APK (arm64)' || 'Signed APKs' }}
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ inputs.release-tag == '' && 45 || 90 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: ./.github/actions/setup
        with:
          android: "true"

      - name: Build
        if: inputs.release-tag == ''
        run: bash scripts/build.sh --mode debug --abi arm64 --no-prereqs

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: inputs.release-tag == ''
        with:
          name: debug-apk-arm64
          path: build/app/outputs/apk/debug/*.apk
          retention-days: 7

      - name: Decode signing key
        if: inputs.release-tag != ''
        env:
          KEYSTORE_BASE64: ${{ secrets.TT_RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [[ -z "$KEYSTORE_BASE64" ]]; then
            echo "::error::Secret TT_RELEASE_KEYSTORE_BASE64 is not set"
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"

      - name: Build signed APKs
        if: inputs.release-tag != ''
        env:
          TT_RELEASE_STORE_FILE: ${{ runner.temp }}/release.jks
          TT_RELEASE_STORE_PASSWORD: ${{ secrets.TT_RELEASE_STORE_PASSWORD }}
          TT_RELEASE_KEY_ALIAS: ${{ secrets.TT_RELEASE_KEY_ALIAS }}
          TT_RELEASE_KEY_PASSWORD: ${{ secrets.TT_RELEASE_KEY_PASSWORD }}
        run: bash scripts/build.sh --mode release --abi all --no-prereqs

      - name: Remove signing key
        if: always() && inputs.release-tag != ''
        run: rm -f "$RUNNER_TEMP/release.jks"

      - name: Verify signatures
        if: inputs.release-tag != ''
        run: |
          apksigner="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)/apksigner"
          for apk in build/app/outputs/apk/release/*.apk; do
            "$apksigner" verify "$apk"
            digest="$("$apksigner" verify --print-certs "$apk" \
              | sed -n 's/.*certificate SHA-256 digest: //p' | head -1)"
            if [[ "$digest" != "$RELEASE_CERT_SHA256" ]]; then
              echo "::error::$(basename "$apk") is signed with $digest, expected $RELEASE_CERT_SHA256"
              exit 1
            fi
          done

      - name: Attest the APKs
        if: inputs.release-tag != ''
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: build/app/outputs/apk/release/*.apk

      - name: Upload to the release
        if: inputs.release-tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.release-tag }}
        run: |
          version="${TAG#v}"
          symbols="TeamTalkX-$version-debug-symbols.zip"
          (cd build/app/outputs/symbols && zip -qr "$RUNNER_TEMP/$symbols" .)
          cd build/app/outputs/apk/release
          sha256sum -- *.apk > SHA256SUMS.txt
          gh release view "$TAG" --json body --jq .body > "$RUNNER_TEMP/notes.md"
          printf '\n' >> "$RUNNER_TEMP/notes.md"
          sed "s/{version}/$version/g; s/{tag}/$TAG/g" \
            "$GITHUB_WORKSPACE/.github/release-notes-footer.md" >> "$RUNNER_TEMP/notes.md"
          gh release upload "$TAG" ./*.apk SHA256SUMS.txt "$RUNNER_TEMP/$symbols" --clobber
          gh release edit "$TAG" --title "TeamTalkX $version" --notes-file "$RUNNER_TEMP/notes.md"
