name: PR title

on:
  pull_request:
    branches: [master]
    types: [opened, edited, synchronize, reopened]

permissions: {}

jobs:
  title:
    name: Conventional title
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Check the title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(feat|fix|perf|refactor|docs|build|ci|test|chore|style|revert)(\([a-z0-9._/-]+\))?!?: [^ ].*$'
          if [[ ! "$TITLE" =~ $pattern ]]; then
            echo "::error::The title must be a Conventional Commit, like 'fix(voice): keep FEC on reconnect'. It becomes the squashed commit and its changelog line."
            exit 1
          fi
