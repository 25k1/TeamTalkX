name: CodeQL

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  schedule:
    - cron: "27 4 * * 1"
  workflow_dispatch:

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  analyze:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          - language: c-cpp
            build-mode: manual
          - language: java-kotlin
            build-mode: manual
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up the Android toolchain
        if: matrix.language == 'java-kotlin'
        uses: ./.github/actions/setup
        with:
          android: "true"

      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Build the native module
        if: matrix.language == 'c-cpp'
        run: |
          cmake -S native -B "$RUNNER_TEMP/native" -DCMAKE_BUILD_TYPE=Release
          cmake --build "$RUNNER_TEMP/native" --parallel

      - name: Build the Kotlin code
        if: matrix.language == 'java-kotlin'
        run: |
          sed -i 's/^org.gradle.caching=true$/org.gradle.caching=false/' android/gradle.properties
          bash scripts/build.sh --mode debug --abi arm64 --no-prereqs

      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370
        with:
          category: /language:${{ matrix.language }}
